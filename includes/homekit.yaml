#- from github.com/basnijholt/home-assistant-config
# Only what is useful by voice: one light group per room, the space heater and the TV.
# Assign each accessory to its room in the Home app (bridges cannot set rooms).
# The names double as aliases, e.g. "guest room lights" in the Office room.
- filter:
    include_entities:
      - light.living_room_lights
      - light.bedroom_lights
      - light.guest_room_lights
      - light.baby_room_lights
      - switch.space_heater
      - media_player.tv
  entity_config:
    light.living_room_lights:
      name: Living room lights
    light.bedroom_lights:
      name: Bedroom lights
    light.guest_room_lights:
      name: Guest room lights
    light.baby_room_lights:
      name: Baby room lights
    switch.space_heater:
      name: Space heater
    media_player.tv:
      name: TV
