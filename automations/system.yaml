#- from github.com/basnijholt/home-assistant-config
- alias: "System: warning about high CPU usage"
  triggers:
    trigger: numeric_state
    entity_id: sensor.processor_use
    above: 70
    for:
      hours: 4
  actions:
    action: notify.iphone_bas
    data:
      title: "System"
      message: "CPU usage has been above 70% for 4 hours! ⚠️🖥"

- alias: "System: run chores"
  description: Run shell and Python scripts in utils folder.
  triggers:
    trigger: time_pattern
    minutes: "/15"
  actions:
    action: shell_command.chores

- alias: "System: battery level low"
  triggers:
    trigger: time
    at: "14:30:00"
  variables:
    min_battery_level: 50
    notify_service: notify.iphone_bas
    battery_ids: ""
    current: ""
  actions:
    - variables:
        battery_ids: >
          {% set ns = namespace(battery=[]) %}
          {% for s in states.sensor if 'battery_level' in s.entity_id %}
            {% set ns.battery = ns.battery + [s] %}
          {% endfor %}
          {{ ns.battery | map(attribute='entity_id') | list }}
    - alias: Repeat
      repeat:
        count: "{{ battery_ids | length }}"
        sequence:
          - variables:
              current: "{{ battery_ids[repeat.index - 1] }}"
          - condition: template
            value_template: "{{ 'iphone' not in current and 'ipad' not in current }}"
          - condition: template
            value_template: "{{ 0 < (states(current) | float) < (min_battery_level | float ) }}"
          - action: "{{ notify_service }}"
            data:
              title: "System"
              message: "Battery level low of {{ current }}: {{ states(current) }}%! ⚠️"

- alias: "System: warning about low disk space"
  id: system_low_disk_space
  triggers:
    trigger: numeric_state
    entity_id: sensor.disk_use_percent
    above: 80
    for:
      minutes: 30
  actions:
    action: notify.iphone_bas
    data:
      title: "System"
      message: >-
        Disk usage is at {{ states('sensor.disk_use_percent') }}%! Free space is
        running low on Home Assistant. WARNING
      data:
        push:
          interruption-level: time-sensitive

- alias: "System: critical disk space"
  id: system_critical_disk_space
  triggers:
    trigger: numeric_state
    entity_id: sensor.disk_use_percent
    above: 90
    for:
      minutes: 10
  actions:
    action: notify.iphone_bas
    data:
      title: "System"
      message: >-
        CRITICAL: disk usage at {{ states('sensor.disk_use_percent') }}%.
        Backups and addons will start failing.
      data:
        push:
          interruption-level: critical

- alias: "System: backups are stale"
  id: system_backups_stale
  triggers:
    trigger: state
    entity_id: binary_sensor.backups_stale
    to: "on"
    for:
      hours: 6
  actions:
    action: notify.iphone_bas
    data:
      title: "System"
      message: >-
        Home Assistant backups are stale - last successful backup was
        {% set last_backup = state_attr('sensor.backup_state', 'last_backup') | as_datetime(none) -%}
        {{ (last_backup | as_local).strftime('%Y-%m-%d %H:%M') if last_backup else 'unknown' }}
